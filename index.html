<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Timemark — GPS + Thời Tiết</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #1a73e8;
    --danger: #d93025;
    --success: #1e8e3e;
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; overflow-x: hidden; }

  /* ── Screen containers ── */
  .screen { display: none; flex-direction: column; height: 100dvh; }
  .screen.active { display: flex; }

  /* ── Camera ── */
  #cam-screen { background: #000; }
  #video-container { flex: 1; position: relative; overflow: hidden; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #canvas { display: none; }

  .top-bar { position: absolute; top: 0; left: 0; right: 0; padding: 12px 16px; background: linear-gradient(180deg,rgba(0,0,0,.7) 0%,transparent 100%); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
  .status-chip { background: rgba(0,0,0,.55); border-radius: 20px; padding: 6px 12px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status-dot.active { background: var(--success); animation: pulse 1.5s infinite; }
  .status-dot.loading { background: #f0a500; animation: spin 1s linear infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  @keyframes spin { to{transform:rotate(360deg)} }

  .bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px 28px; background: linear-gradient(0deg,rgba(0,0,0,.8) 0%,transparent 100%); display: flex; align-items: center; justify-content: center; gap: 32px; z-index: 10; }

  .cam-btn { border-radius: 50%; border: none; cursor: pointer; transition: transform .1s; }
  .cam-btn:active { transform: scale(0.92); }
  #capture-btn { width: 72px; height: 72px; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.4); }
  #capture-btn:disabled { opacity: .4; }

  .icon-btn { width: 44px; height: 44px; background: rgba(255,255,255,.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; cursor: pointer; backdrop-filter: blur(4px); }

  #gallery-btn { position: absolute; right: 16px; bottom: 36px; }

  .weather-bar { position: absolute; bottom: 120px; left: 16px; right: 80px; background: rgba(0,0,0,.55); border-radius: 12px; padding: 8px 12px; font-size: 12px; display: flex; align-items: center; gap: 10px; backdrop-filter: blur(4px); z-index: 10; }
  .weather-icon { font-size: 20px; }
  .weather-text { flex: 1; }
  .weather-temp { font-size: 16px; font-weight: 600; }
  .weather-desc { color: var(--muted); }

  /* ── Preview ── */
  #preview-screen { background: var(--bg); }
  .preview-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .btn { padding: 8px 16px; border-radius: 8px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-large { width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; margin-top: 12px; }

  .preview-body { flex: 1; overflow-y: auto; }
  .photo-wrap { position: relative; background: #000; min-height: 300px; display: flex; align-items: center; justify-content: center; }
  #preview-img { max-width: 100%; max-height: 50vh; display: block; }
  .overlay { position: absolute; bottom: 8px; left: 8px; right: 8px; background: rgba(0,0,0,.65); border-radius: 8px; padding: 8px 12px; font-size: 11px; color: #fff; backdrop-filter: blur(4px); }
  .overlay-line { display: flex; gap: 6px; margin-bottom: 3px; }
  .overlay-label { color: rgba(255,255,255,.6); min-width: 50px; }
  .overlay-value { font-weight: 500; }

  .info-panel { padding: 16px; }
  .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .info-label { color: var(--muted); }
  .info-value { font-weight: 500; text-align: right; max-width: 60%; word-break: break-all; }

  /* ── Toggle switch ── */
  .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .toggle-label { font-size: 14px; }
  .toggle { width: 44px; height: 24px; background: var(--border); border-radius: 12px; position: relative; cursor: pointer; transition: background .2s; }
  .toggle.on { background: var(--primary); }
  .toggle::after { content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #fff; top: 3px; left: 3px; transition: transform .2s; }
  .toggle.on::after { transform: translateX(20px); }

  /* ── Success ── */
  #success-screen { background: var(--bg); justify-content: center; align-items: center; padding: 24px; text-align: center; gap: 20px; }
  .success-icon { font-size: 72px; }
  .success-title { font-size: 22px; font-weight: 700; }
  .success-sub { color: var(--muted); }
  .file-list { width: 100%; background: var(--surface); border-radius: 12px; padding: 16px; text-align: left; }
  .file-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .file-item:last-child { border-bottom: none; }
  .file-icon { font-size: 20px; }

  /* ── Loading overlay ── */
  #loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 16px; }
  #loading-overlay.active { display: flex; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
  #loading-text { color: var(--muted); font-size: 14px; }

  /* ── Hidden file input ── */
  #file-input { display: none; }
</style>
</head>
<body>

<!-- ── Loading ── -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">Đang lấy GPS…</div>
</div>

<!-- ── Camera Screen ── -->
<div id="cam-screen" class="screen active">
  <div id="video-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="top-bar">
      <div id="gps-status" class="status-chip">
        <div class="status-dot" id="gps-dot"></div>
        <span id="gps-label">Chưa có GPS</span>
      </div>
      <div style="font-size:12px;color:rgba(255,255,255,.6)">Timemark</div>
    </div>

    <div class="weather-bar" id="weather-bar" style="display:none">
      <div class="weather-icon" id="weather-icon">☁</div>
      <div class="weather-text">
        <div class="weather-temp" id="weather-temp">--°C</div>
        <div class="weather-desc" id="weather-desc">--</div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="icon-btn" id="flash-btn" title="Flash">⚡</div>
      <button id="capture-btn" class="cam-btn" disabled></button>
      <div class="icon-btn" id="gallery-btn" title="Chọn ảnh">🖼</div>
    </div>
  </div>
</div>

<!-- ── Preview Screen ── -->
<div id="preview-screen" class="screen">
  <div class="preview-header">
    <button class="btn btn-ghost" id="btn-back">← Quay lại</button>
    <button class="btn btn-danger" id="btn-discard">Xoá</button>
  </div>

  <div class="preview-body">
    <div class="photo-wrap">
      <img id="preview-img" src="" alt="Preview">
      <div class="overlay" id="photo-overlay">
        <div class="overlay-line">
          <span class="overlay-label">📍</span>
          <span class="overlay-value" id="ol-loc">--</span>
        </div>
        <div class="overlay-line">
          <span class="overlay-label">🕐</span>
          <span class="overlay-value" id="ol-time">--</span>
        </div>
        <div class="overlay-line">
          <span class="overlay-label">🌡</span>
          <span class="overlay-value" id="ol-weather">--</span>
        </div>
      </div>
    </div>

    <div class="info-panel">
      <div class="toggle-row">
        <span class="toggle-label">Hiện watermark trên ảnh</span>
        <div class="toggle on" id="overlay-toggle"></div>
      </div>

      <div id="info-rows"></div>

      <button class="btn btn-primary btn-large" id="btn-save">
        ⬇ Lưu về máy
      </button>
    </div>
  </div>
</div>

<!-- ── Success Screen ── -->
<div id="success-screen" class="screen">
  <div class="success-icon">✅</div>
  <div class="success-title">Đã lưu!</div>
  <div class="success-sub">Ảnh + metadata đã được tải về máy</div>
  <div class="file-list">
    <div class="file-item"><div class="file-icon">📷</div><div id="file-jpg">IMG_xxxx.jpg</div></div>
    <div class="file-item"><div class="file-icon">📄</div><div id="file-json">IMG_xxxx.json</div></div>
  </div>
  <button class="btn btn-primary btn-large" id="btn-new">📸 Chụp tiếp</button>
</div>

<input type="file" id="file-input" accept="image/*">

<script src="app.js"></script>
<script>
// Service Worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
